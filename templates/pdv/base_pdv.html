<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}PDV{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: #fff;
        }
        header {
            background: #000;
            padding: 15px;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
        }
        main {
            padding: 20px;
        }
        button {
            padding: 15px 20px;
            font-size: 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        .btn-primary {
            background: #28a745;
            color: #fff;
        }
        .btn-danger {
            background: #dc3545;
            color: #fff;
        }
        .btn-secondary {
            background: #444;
            color: #fff;
        }
        input {
            width: 100%;
            padding: 18px;
            font-size: 22px;
            margin-bottom: 15px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 12px;
            border-bottom: 1px solid #333;
            font-size: 18px;
        }
        .total {
            font-size: 26px;
            text-align: right;
            margin-top: 20px;
        }
    </style>

    {% block extra_css %}{% endblock %}
</head>
<body>

<header>
    MERCADO AUTÔNOMO
</header>

<main>
    {% block content %}{% endblock %}
</main>

</body>
</html>
