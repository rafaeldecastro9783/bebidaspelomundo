{% extends 'base.html' %}
{% block content %}
<hr>
<div class="container">

    <h3 class="text-center"> Produto: {{ produto.titulo }} </h3>
    <div class="rcontainer">
        <img class="card-img-top" style="width: 12rem;" src="{{ produto.imagem.url }}" alt="Card image cap">
        <img class="card-img-top" style="width: 12rem;" src="{{ produto.imagem2.url }}" alt="Card image cap">
        <img class="card-img-top" style="width: 12rem;" src="{{ produto.imagem3.url }}" alt="Card image cap">
        <div class="card-body">
            <h3 class="mt-3"> Preço: R$.{{ produto.preco_venda }}</h3>
            <h3>Categoria: {{ produto.categoria }}</h3>
            <h4 class="mt-3"> Visualizações: {{ produto.visualizacao }} </h4>
            <h5>Descrição: </h5>
            <h5>{{ produto.descricao }}</h5>
        
            <a href="{% url 'loja:addkart' produto.id %}" class="btn btn-success">Adicionar ao Carrinho</a>
        </div>
    </div>
</div>
{% endblock %}
