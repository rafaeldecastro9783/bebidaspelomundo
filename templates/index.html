{% extends 'base.html' %}
{% block content %}
<hr>
<div class="container">
    <h1 class="text-center"> Os mais pedidos:</h1>
    <div class="row">
        {% for p in produto_list %}
            <div class="card" style="width: 12rem;">
                <img class="card-img-top" src="{{p.imagem.url}}" alt="Card image cap">
                <div class="card-body">
                <h4><a href="{% url 'loja:produtodetalhe' p.slug %}">{{ p.titulo }}</a></h4>
                <p class="mt-3"> preço: R$.{{p.preco_venda}}</p>
                <a href="{% url 'loja:addkart' p.id %}" class="btn btn-success"> adicinar</a>
            </div>
        </div>
        {% endfor %}
    </div>  
</div>    
 {% endblock %}
