{% extends 'base.html' %}
{% block content %}
<hr>
<div class="container">
    <h1 class="text-center"> Todos os Produtos:</h1>
    <div class="row">
        {% for cat in todascategorias %}
        <h3 class="text-center"> {{cat.titulo}}:</h3>
            {% for p in cat.produto_set.all %}
                <div class="card" style="width: 12rem;">
                <img class="card-img-top" src="{{p.imagem.url}}" alt="Card image cap">
                <div class="card-body">
                <h4><a href="{% url 'loja:produtodetalhe' p.slug %}">{{ p.titulo }}</a></h4>
                <p class="mt-3"> preço: R$.{{p.preco_venda}}</p>
                <a href="{% url 'loja:addkart' p.id %}" class="btn btn-success"> adicionar</a>
            </div>
            {% endfor %}
        </div>
        {% endfor %}
    </div>  
</div>    
 {% endblock %}
